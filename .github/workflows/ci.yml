name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: marketplace-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release_check:
    name: Check release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_needed: ${{ steps.release.outputs.needed }}
    steps:
      - uses: actions/checkout@v6
      - name: Read package-lock version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package-lock.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check whether release already exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; validation, packaging, and release creation will be skipped."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Validate (${{ matrix.os }})
    needs: release_check
    if: needs.release_check.outputs.release_needed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  package:
    name: Package VSIX
    needs: release_check
    if: needs.release_check.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: codex-account-switcher-vsix
          path: "*.vsix"
          if-no-files-found: error

  release:
    name: Create GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release_check.outputs.release_needed == 'true'
    needs: [release_check, validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: codex-account-switcher-vsix
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release_check.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG" dist/*.vsix \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
